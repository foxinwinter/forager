[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forager"
version = "0.2.0"
description = "Steam-like game launcher for your local game library"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.6",
    "evdev>=1.6",
    "keyring>=24",
    "Pillow>=10",
    "qrcode>=7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
forager = "forager.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
forager = ["resources/icons/*", "resources/fonts/*"]

[tool.setuptools.packages.find]
where = ["src"]
