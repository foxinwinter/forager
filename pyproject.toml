[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forager"
version = "0.1.3"
description = "Steam-like game launcher for your local game library"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.6",
    "evdev>=1.6",
    "keyring>=24",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
forager = "forager.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
forager = ["resources/icons/*.svg", "resources/fonts/*.ttf"]

[tool.setuptools.packages.find]
where = ["src"]
